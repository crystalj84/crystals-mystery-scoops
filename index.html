<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crystal's Mystery Scoops</title>

<style>
:root{
  --pink:#ff2f92;
  --gold:#f4c76b;
  --dark:#160812;
  --dark2:#24101d;
  --white:#fff;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top,#4a102e 0%,#160812 45%,#090408 100%);
  color:white;
  min-height:100vh;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:1000;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:15px 25px;

  background:rgba(20,5,15,.96);
  border-bottom:2px solid var(--gold);
  box-shadow:0 5px 20px #0008;
}

.logo{
  font-size:24px;
  font-weight:800;
  color:white;
}

.logo span{
  color:var(--pink);
}

header button{
  background:var(--pink);
  color:white;
  border:none;
  padding:11px 18px;
  border-radius:25px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 4px 12px #0006;
}

header button:hover{
  transform:translateY(-1px);
}

#count{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-width:22px;
  height:22px;

  margin-left:5px;

  background:var(--gold);
  color:#24101d;

  border-radius:50%;
  font-size:13px;
}

/* HERO */
.hero{
  max-width:1200px;
  margin:auto;

  padding:70px 25px;

  display:grid;
  grid-template-columns:1fr;
  gap:40px;

  align-items:center;
}

.hero small{
  color:var(--gold);
  font-weight:bold;
  letter-spacing:3px;
}

.hero-logo{
  display:block;

  width:min(100%,550px);
  max-height:230px;

  object-fit:contain;

  margin:15px 0 20px;
}

.hero p{
  max-width:650px;

  font-size:18px;
  line-height:1.7;

  color:#f5dce8;
}

.hero a{
  display:inline-block;

  margin-top:15px;
  padding:14px 25px;

  background:var(--pink);
  color:white;

  text-decoration:none;

  border-radius:30px;

  font-weight:bold;
  box-shadow:0 8px 20px #0007;
}

.hero a:hover{
  transform:translateY(-2px);
}

/* SECTIONS */
section{
  max-width:1200px;
  margin:auto;
  padding:35px 25px 60px;
}

section h2{
  text-align:center;

  color:var(--gold);

  font-size:32px;

  margin:0 0 30px;
}

/* PRODUCT GRID */
.grid{
  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

  gap:22px;
}

.card{
  background:
    linear-gradient(
      145deg,
      rgba(255,47,146,.15),
      rgba(255,255,255,.04)
    );

  border:1px solid #f4c76b55;

  border-radius:20px;

  padding:25px;

  text-align:center;

  box-shadow:0 12px 30px #0007;

  transition:
    transform .2s ease,
    border-color .2s ease;
}

.card:hover{
  transform:translateY(-5px);
  border-color:var(--gold);
}

.card h3{
  margin-top:0;

  color:white;

  font-size:21px;
}

.card p{
  color:#e9cfdc;

  min-height:45px;

  line-height:1.5;
}

.price{
  color:var(--gold);

  font-size:25px;
  font-weight:bold;

  margin:15px 0;
}

.card button{
  width:100%;

  padding:12px;

  border:none;
  border-radius:25px;

  background:var(--pink);
  color:white;

  font-weight:bold;
  font-size:15px;

  cursor:pointer;
}

.card button:hover{
  background:#ff58a8;
}

/* IMAGE SECTIONS */
.image-section{
  text-align:center;
}

.image-section img{
  display:block;

  width:100%;
  max-width:900px;

  height:auto;

  margin:0 auto;

  border:2px solid var(--gold);

  border-radius:20px;

  box-shadow:0 12px 30px #0008;
}

/* CART OVERLAY */
#overlay{
  position:fixed;
  inset:0;

  background:#0009;

  z-index:1999;

  display:none;
}

#overlay.show{
  display:block;
}

/* CART */
#cart{
  position:fixed;

  top:0;
  right:-430px;

  width:min(430px,100%);

  height:100vh;

  z-index:2000;

  background:
    linear-gradient(
      180deg,
      #2b1020,
      #10060d
    );

  border-left:2px solid var(--gold);

  box-shadow:-10px 0 35px #0009;

  transition:right .3s ease;

  display:flex;
  flex-direction:column;
}

#cart.open{
  right:0;
}

.cart-header{
  display:flex;

  justify-content:space-between;
  align-items:center;

  padding:20px;

  border-bottom:1px solid #f4c76b55;
}

.cart-header h2{
  margin:0;

  color:var(--gold);
}

.close-cart{
  border:none;

  background:none;

  color:white;

  font-size:30px;

  cursor:pointer;
}

#cartItems{
  flex:1;

  overflow-y:auto;

  padding:20px;
}

.cart-item{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:15px;

  padding:15px 0;

  border-bottom:1px solid #ffffff22;
}

.cart-item strong{
  display:block;
}

.cart-item small{
  color:#dcbaca;
}

.cart-remove{
  border:none;

  background:#ffffff12;

  color:#ff8bbb;

  border-radius:20px;

  padding:7px 10px;

  cursor:pointer;
}

.cart-bottom{
  padding:20px;

  border-top:1px solid #f4c76b55;
}

.shipping{
  display:flex;

  align-items:center;

  gap:10px;

  margin-bottom:15px;

  padding:12px;

  background:#ffffff0a;

  border-radius:10px;
}

.shipping input{
  width:18px;
  height:18px;
}

.total{
  display:flex;

  justify-content:space-between;

  font-size:22px;
  font-weight:bold;

  margin-bottom:15px;
}

#checkoutBtn{
  width:100%;

  padding:15px;

  border:none;
  border-radius:30px;

  background:var(--pink);

  color:white;

  font-size:17px;
  font-weight:bold;

  cursor:pointer;
}

#checkoutBtn:hover{
  background:#ff58a8;
}

/* EMPTY CART */
.empty{
  text-align:center;

  padding:50px 20px;

  color:#dcbaca;
}

/* FOOTER */
footer{
  text-align:center;

  padding:35px 20px;

  border-top:1px solid #f4c76b33;

  color:#cdaebe;
}

/* MOBILE */
@media(max-width:700px){

  header{
    padding:12px 15px;
  }

  .logo{
    font-size:18px;
  }

  .hero{
    grid-template-columns:1fr;

    text-align:center;

    padding:45px 20px;
  }

  .hero-logo{
    margin-left:auto;
    margin-right:auto;
  }

  .hero p{
    margin-left:auto;
    margin-right:auto;
  }

  section{
    padding-left:18px;
    padding-right:18px;
  }

  section h2{
    font-size:27px;
  }

  .grid{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<!-- HEADER -->
<header>

  <div class="logo">
    Crystal's <span>Mystery Scoops</span>
  </div>

  <button onclick="toggleCart()">
    Cart <b id="count">0</b>
  </button>

</header>


<!-- HERO -->
<div class="hero">

  <div>

    <small>MYSTERY SCOOPS</small>

    <!-- LOGO -->
    <img
      src="logo.png"
      alt="Crystal's Mystery Scoops"
      class="hero-logo"
    >

    <p>
      Discover the magic of mystery scoops!
      Each scoop is packed with surprise items.
      Order yours today and unbox the mystery!
    </p>

    <a href="#shop">
      Shop Now
    </a>

  </div>

</div>


<!-- PRODUCTS -->
<section id="shop">

  <h2>Our Scoops</h2>

  <div
    class="grid"
    id="products"
  ></div>

</section>


<!-- ADD-ONS -->
<section>

  <h2>Add-Ons</h2>

  <div
    class="grid"
    id="addons"
  ></div>

</section>


<!-- PRICE LIST -->
<section class="image-section">

  <h2>Our Prices</h2>

  <img
    src="price-list.jpg"
    alt="Crystal's Mystery Scoops Price List"
  >

</section>


<!-- PRODUCT LIST -->
<section class="image-section">

  <h2>Scoop Product List</h2>

  <img
    src="scoop-product-list.jpg"
    alt="Crystal's Mystery Scoops Product List"
  >

</section>


<!-- FOOTER -->
<footer>

  Crystal's Mystery Scoops

</footer>


<!-- CART OVERLAY -->
<div
  id="overlay"
  onclick="toggleCart()"
></div>


<!-- CART -->
<aside id="cart">

  <div class="cart-header">

    <h2>Your Cart</h2>

    <button
      class="close-cart"
      onclick="toggleCart()"
      aria-label="Close cart"
    >
      ×
    </button>

  </div>


  <div id="cartItems">

    <div class="empty">
      Your cart is empty.
    </div>

  </div>


  <div class="cart-bottom">

    <label class="shipping">

      <input
        type="checkbox"
        id="shipping"
        onchange="updateCart()"
      >

      <span>
        Add $20 shipping
      </span>

    </label>


    <div class="total">

      <span>Total</span>

      <span id="total">
        $0.00
      </span>

    </div>


    <button
      id="checkoutBtn"
      onclick="checkout()"
    >
      Checkout
    </button>

  </div>

</aside>


<script>

/* =========================================
   PRODUCTS
========================================= */

const products = [

  {
    id:"mini",
    name:"Mini Mystery Scoop",
    price:15,
    desc:"A fun mini mystery surprise."
  },

  {
    id:"crystalsmysteryscoops",
    name:"Regular Mystery Scoop",
    price:25,
    desc:"Includes 5-10 mystery items."
  },

  {
    id:"large",
    name:"Large Mystery Scoop",
    price:45,
    desc:"Includes 11-20 mystery items."
  },

  {
    id:"double",
    name:"Regular Double Scoop",
    price:45,
    desc:"Double the mystery fun."
  },

  {
    id:"triple",
    name:"Regular Triple Scoop",
    price:65,
    desc:"Triple the mystery fun."
  }

];


/* =========================================
   ADD-ONS
========================================= */

const addons = [

  {
    id:"video",
    name:"Packing Video",
    price:12,
    desc:"Add a packing video to your order."
  },

  {
    id:"rare",
    name:"Extra Rare Ball",
    price:10,
    desc:"Add an extra rare ball to your scoop."
  }

];


/* =========================================
   CART
========================================= */

let cart = [];

/* -- ADD TO CART -- */
function addToCart(id){

  const item =
    [...products, ...addons].find(p => p.id === id);

  if(!item) return;

  const existing = cart.find(c => c.id === id);

  if(existing){
    existing.qty++;
  } else {
    cart.push({ ...item, qty:1 });
  }

  renderCart();
  flashCart();
}

/* -- REMOVE FROM CART -- */
function removeFromCart(id){

  cart = cart.filter(c => c.id !== id);

  renderCart();
}

/* -- CHANGE QTY -- */
function changeQty(id, delta){

  const item = cart.find(c => c.id === id);

  if(!item) return;

  item.qty += delta;

  if(item.qty <= 0){
    removeFromCart(id);
  } else {
    renderCart();
  }

}

/* -- RENDER CART -- */
function renderCart(){

  const container = document.getElementById("cartItems");
  const count = document.getElementById("count");
  const total = document.getElementById("total");

  let qtyTotal = 0;
  let priceTotal = 0;

  if(cart.length === 0){
    container.innerHTML =
      '<div class="empty">Your cart is empty.</div>';
  } else {
    container.innerHTML = cart.map(item => `
      <div class="cart-item">
        <div>
          <strong>${item.name}</strong>
          <small>$${item.price} × ${item.qty}</small>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <button class="cart-remove" onclick="changeQty('${item.id}',-1)">−</button>
          <span>${item.qty}</span>
          <button class="cart-remove" onclick="changeQty('${item.id}',1)">+</button>
          <button class="cart-remove" onclick="removeFromCart('${item.id}')">Remove</button>
        </div>
      </div>
    `).join("");
  }

  cart.forEach(item => {
    qtyTotal += item.qty;
    priceTotal += item.price * item.qty;
  });

  const shipping = document.getElementById("shipping");
  if(shipping && shipping.checked){
    priceTotal += 20;
  }

  count.textContent = qtyTotal;
  total.textContent = "$" + priceTotal.toFixed(2);

}

/* -- TOGGLE CART -- */
function toggleCart(){

  const cart = document.getElementById("cart");
  const overlay = document.getElementById("overlay");

  cart.classList.toggle("open");
  overlay.classList.toggle("show");

}

/* -- FLASH CART -- */
function flashCart(){

  const cart = document.getElementById("cart");
  const overlay = document.getElementById("overlay");

  cart.classList.add("open");
  overlay.classList.add("show");

  setTimeout(() => {
    cart.classList.remove("open");
    overlay.classList.remove("show");
  }, 1500);

}

/* -- CHECKOUT -- */
async function checkout(){

  if(cart.length === 0){
    alert("Your cart is empty!");
    return;
  }

  const shipping = document.getElementById("shipping");
  const includeShipping = shipping && shipping.checked;

  const payload = {
    items: cart.map(item => ({
      id: item.id,
      name: item.name,
      price: item.price,
      qty: item.qty
    })),
    shipping: includeShipping
  };

  try {

    const resp = await fetch("/api/checkout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await resp.json();

    if(data.url){
      window.location.href = data.url;
    } else {
      alert("Checkout error: " + (data.error || "Unknown error"));
    }

  } catch(err){
    alert("Checkout failed: " + err.message);
  }

}

/* -- RENDER PRODUCTS -- */
function renderProducts(){

  const container = document.getElementById("products");

  container.innerHTML = products.map(p => `
    <div class="card">
      <h3>${p.name}</h3>
      <p>${p.desc}</p>
      <div class="price">$${p.price}</div>
      <button onclick="addToCart('${p.id}')">Add to Cart</button>
    </div>
  `).join("");

}

/* -- RENDER ADD-ONS -- */
function renderAddons(){

  const container = document.getElementById("addons");

  container.innerHTML = addons.map(a => `
    <div class="card">
      <h3>${a.name}</h3>
      <p>${a.desc}</p>
      <div class="price">$${a.price}</div>
      <button onclick="addToCart('${a.id}')">Add to Cart</button>
    </div>
  `).join("");

}

/* -- INIT -- */
renderProducts();
renderAddons();

</script>

</body>
</html>
