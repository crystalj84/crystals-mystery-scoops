<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crystal's Mystery Scoops</title>

<style>
:root{
  --pink:#ff2f92;
  --gold:#f4c76b;
  --dark:#160812;
  --dark2:#24101d;
  --white:#fff;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top,#4a102e 0%,#160812 45%,#090408 100%);
  color:white;
  min-height:100vh;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:1000;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:15px 25px;

  background:rgba(20,5,15,.96);
  border-bottom:2px solid var(--gold);
  box-shadow:0 5px 20px #0008;
}

.logo{
  font-size:24px;
  font-weight:800;
  color:white;
}

.logo span{
  color:var(--pink);
}

header button{
  background:var(--pink);
  color:white;
  border:none;
  padding:11px 18px;
  border-radius:25px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 4px 12px #0006;
}

header button:hover{
  transform:translateY(-1px);
}

#count{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-width:22px;
  height:22px;

  margin-left:5px;

  background:var(--gold);
  color:#24101d;

  border-radius:50%;
  font-size:13px;
}

/* HERO */
.hero{
  max-width:1200px;
  margin:auto;

  padding:70px 25px;

  display:grid;
  grid-template-columns:1fr;
  gap:40px;

  align-items:center;
}

.hero small{
  color:var(--gold);
  font-weight:bold;
  letter-spacing:3px;
}

.hero-logo{
  display:block;

  width:min(100%,550px);
  max-height:230px;

  object-fit:contain;

  margin:15px 0 20px;
}

.hero p{
  max-width:650px;

  font-size:18px;
  line-height:1.7;

  color:#f5dce8;
}

.hero a{
  display:inline-block;

  margin-top:15px;
  padding:14px 25px;

  background:var(--pink);
  color:white;

  text-decoration:none;

  border-radius:30px;

  font-weight:bold;
  box-shadow:0 8px 20px #0007;
}

.hero a:hover{
  transform:translateY(-2px);
}

/* SECTIONS */
section{
  max-width:1200px;
  margin:auto;
  padding:35px 25px 60px;
}

section h2{
  text-align:center;

  color:var(--gold);

  font-size:32px;

  margin:0 0 30px;
}

/* PRODUCT GRID */
.grid{
  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

  gap:22px;
}

.card{
  background:
    linear-gradient(
      145deg,
      rgba(255,47,146,.15),
      rgba(255,255,255,.04)
    );

  border:1px solid #f4c76b55;

  border-radius:20px;

  padding:25px;

  text-align:center;

  box-shadow:0 12px 30px #0007;

  transition:
    transform .2s ease,
    border-color .2s ease;
}

.card:hover{
  transform:translateY(-5px);
  border-color:var(--gold);
}

.card h3{
  margin-top:0;

  color:white;

  font-size:21px;
}

.card p{
  color:#e9cfdc;

  min-height:45px;

  line-height:1.5;
}

.price{
  color:var(--gold);

  font-size:25px;
  font-weight:bold;

  margin:15px 0;
}

.card button{
  width:100%;

  padding:12px;

  border:none;
  border-radius:25px;

  background:var(--pink);
  color:white;

  font-weight:bold;
  font-size:15px;

  cursor:pointer;
}

.card button:hover{
  background:#ff58a8;
}

/* IMAGE SECTIONS */
.image-section{
  text-align:center;
}

.image-section img{
  display:block;

  width:100%;
  max-width:900px;

  height:auto;

  margin:0 auto;

  border:2px solid var(--gold);

  border-radius:20px;

  box-shadow:0 12px 30px #0008;
}

/* CART OVERLAY */
#overlay{
  position:fixed;
  inset:0;

  background:#0009;

  z-index:1999;

  display:none;
}

#overlay.show{
  display:block;
}

/* CART */
#cart{
  position:fixed;

  top:0;
  right:-430px;

  width:min(430px,100%);

  height:100vh;

  z-index:2000;

  background:
    linear-gradient(
      180deg,
      #2b1020,
      #10060d
    );

  border-left:2px solid var(--gold);

  box-shadow:-10px 0 35px #0009;

  transition:right .3s ease;

  display:flex;
  flex-direction:column;
}

#cart.open{
  right:0;
}

.cart-header{
  display:flex;

  justify-content:space-between;
  align-items:center;

  padding:20px;

  border-bottom:1px solid #f4c76b55;
}

.cart-header h2{
  margin:0;

  color:var(--gold);
}

.close-cart{
  border:none;

  background:none;

  color:white;

  font-size:30px;

  cursor:pointer;
}

#cartItems{
  flex:1;

  overflow-y:auto;

  padding:20px;
}

.cart-item{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:15px;

  padding:15px 0;

  border-bottom:1px solid #ffffff22;
}

.cart-item strong{
  display:block;
}

.cart-item small{
  color:#dcbaca;
}

.cart-remove{
  border:none;

  background:#ffffff12;

  color:#ff8bbb;

  border-radius:20px;

  padding:7px 10px;

  cursor:pointer;
}

.cart-bottom{
  padding:20px;

  border-top:1px solid #f4c76b55;
}

.shipping-info{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
  padding:12px;
  background:#ffffff0a;
  border-radius:10px;
  font-size:15px;
  color:#f4c76b;
}

.total{
  display:flex;

  justify-content:space-between;

  font-size:22
